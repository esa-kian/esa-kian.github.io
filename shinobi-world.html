<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f;
            font-size: 14px;
            z-index: 100;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script src="./three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player = {
            velocity: new THREE.Vector3(),
            baseSpeed: 0.5,
            boostSpeed: 1.5,
            autoForwardSpeed: 0.5,
            minSpeed: 0.1,
            maxSpeed: 5.0
        };
        let keys = {};
        let chunks = new Map();
        const chunkSize = 50;
        const viewDistance = 3;
        let time = 0;

        const MIN_CHUNK_OBJECTS = 1;
        const MAX_CHUNK_OBJECTS = 3;

        const backgroundColor = new THREE.Color();

        function init() {
            document.addEventListener('dblclick', toggleFullscreen);
            scene = new THREE.Scene();
            scene.background = backgroundColor;

            scene.fog = new THREE.FogExp2(0x000510, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x220033, 0.3);
            scene.add(ambientLight);

            const colors = [0xff00ff, 0x00ffff, 0xffff00, 0xff0000, 0x00ff00, 0x0000ff];
            for (let i = 0; i < 6; i++) {
                const light = new THREE.PointLight(colors[i], 1.5, 150);
                light.position.set(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
                light.userData.speed = 0.2 + Math.random() * 0.3;
                light.userData.offset = Math.random() * Math.PI * 2;
                scene.add(light);
            }

            createStarField();

            document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    mouseX = (e.movementX || 0) * 0.002;
                    mouseY = (e.movementY || 0) * 0.002;

                    camera.rotation.y -= mouseX;
                    camera.rotation.x -= mouseY;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });

            document.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            window.addEventListener('resize', onWindowResize);

            animate();
        }
        function toggleFullscreen() {
            const element = document.body;

            if (!document.fullscreenElement) {
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) { 
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) { 
                    element.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) { 
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) { 
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        function createStarField() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1000;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 1000;
                positions[i + 1] = (Math.random() - 0.5) * 1000;
                positions[i + 2] = (Math.random() - 0.5) * 1000;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 2,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        function createWeirdObject(x, y, z) {
            const geometries = [
                new THREE.TorusGeometry(2, 0.5, 16, 100),
                new THREE.OctahedronGeometry(2),
                new THREE.IcosahedronGeometry(2),
                new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16),
                new THREE.DodecahedronGeometry(2),
                new THREE.ConeGeometry(2, 4, 8),
                new THREE.TetrahedronGeometry(2),
                new THREE.SphereGeometry(2, 6, 6),
                new THREE.BoxGeometry(3, 3, 3),
                new THREE.CylinderGeometry(1, 2, 4, 6)
            ];

            const simpleGeometries = [
                new THREE.TetrahedronGeometry(2),
                new THREE.SphereGeometry(2, 6, 6),
                new THREE.BoxGeometry(3, 3, 3)
            ];

            const geometry = (Math.random() < 0.8)
                ? simpleGeometries[Math.floor(Math.random() * simpleGeometries.length)]
                : geometries[Math.floor(Math.random() * geometries.length)];

            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                emissive: new THREE.Color().setHSL(Math.random(), 1, 0.3),
                shininess: 100,
                wireframe: false,
                transparent: false,
                opacity: 1
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.rotation.set(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );

            const scale = 0.5 + Math.random() * 3;
            mesh.scale.set(scale, scale, scale);

            mesh.userData = {
                rotationSpeed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03
                ),
                floatSpeed: 0.5 + Math.random() * 1.5,
                floatOffset: Math.random() * Math.PI * 2,
                basePos: new THREE.Vector3(x, y, z),
                orbitRadius: 0.5 + Math.random() * 2
            };

            return mesh;
        }

        function getChunkKey(x, y, z) {
            return `${Math.floor(x / chunkSize)}_${Math.floor(y / chunkSize)}_${Math.floor(z / chunkSize)}`;
        }

        function generateChunk(chunkX, chunkY, chunkZ) {
            const key = `${chunkX}_${chunkY}_${chunkZ}`;
            if (chunks.has(key)) return;

            const chunkObjects = [];
            const offsetX = chunkX * chunkSize;
            const offsetY = chunkY * chunkSize;
            const offsetZ = chunkZ * chunkSize;

            const numObjects = MIN_CHUNK_OBJECTS + Math.floor(Math.random() * (MAX_CHUNK_OBJECTS - MIN_CHUNK_OBJECTS + 1));

            for (let i = 0; i < numObjects; i++) {
                const x = offsetX + (Math.random() - 0.5) * chunkSize;
                const y = offsetY + (Math.random() - 0.5) * chunkSize;
                const z = offsetZ + (Math.random() - 0.5) * chunkSize;

                const obj = createWeirdObject(x, y, z);
                scene.add(obj);
                chunkObjects.push(obj);
            }

            chunks.set(key, chunkObjects);
        }

        function updateChunks() {
            const playerChunkX = Math.floor(camera.position.x / chunkSize);
            const playerChunkY = Math.floor(camera.position.y / chunkSize);
            const playerChunkZ = Math.floor(camera.position.z / chunkSize);

            for (let x = playerChunkX - viewDistance; x <= playerChunkX + viewDistance; x++) {
                for (let y = playerChunkY - viewDistance; y <= playerChunkY + viewDistance; y++) {
                    for (let z = playerChunkZ - viewDistance; z <= playerChunkZ + viewDistance; z++) {
                        generateChunk(x, y, z);
                    }
                }
            }

            const toRemove = [];
            chunks.forEach((objs, key) => {
                const [cx, cy, cz] = key.split('_').map(Number);
                if (Math.abs(cx - playerChunkX) > viewDistance + 1 ||
                    Math.abs(cy - playerChunkY) > viewDistance + 1 ||
                    Math.abs(cz - playerChunkZ) > viewDistance + 1) {
                    objs.forEach(obj => scene.remove(obj));
                    toRemove.push(key);
                }
            });
            toRemove.forEach(key => chunks.delete(key));
        }

        function updatePlayer() {
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            const up = new THREE.Vector3(0, 1, 0);

            camera.getWorldDirection(forward);
            right.crossVectors(forward, up);

            let speed = (keys['shift']) ? player.boostSpeed : player.baseSpeed;

            if (keys['w']) {
                player.autoForwardSpeed += 0.05;
            }
            if (keys['s']) {
                player.autoForwardSpeed -= 0.05;
            }

            player.autoForwardSpeed = Math.max(player.minSpeed, Math.min(player.maxSpeed, player.autoForwardSpeed));

            speed = (keys['shift']) ? player.boostSpeed : player.autoForwardSpeed;


            const moveVector = new THREE.Vector3();

            moveVector.add(forward.clone().multiplyScalar(speed));

            if (keys['a']) moveVector.sub(right.clone().multiplyScalar(player.baseSpeed));
            if (keys['d']) moveVector.add(right.clone().multiplyScalar(player.baseSpeed));

            if (keys['e']) moveVector.y += player.baseSpeed;
            if (keys['q']) moveVector.y -= player.baseSpeed;

            camera.position.add(moveVector);
        }

        function updateBackground() {
            const hue = (time * 0.10) % 1;

            backgroundColor.setHSL(hue, 1.0, 0.10);

            scene.background = backgroundColor;

            scene.fog.color.copy(backgroundColor);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            updatePlayer();
            updateChunks();
            updateBackground();

            chunks.forEach((objs) => {
                objs.forEach(obj => {
                    obj.rotation.x += obj.userData.rotationSpeed.x;
                    obj.rotation.y += obj.userData.rotationSpeed.y;
                    obj.rotation.z += obj.userData.rotationSpeed.z;

                    const t = time * obj.userData.floatSpeed + obj.userData.floatOffset;
                    obj.position.x = obj.userData.basePos.x + Math.sin(t) * obj.userData.orbitRadius;
                    obj.position.y = obj.userData.basePos.y + Math.cos(t * 1.3) * obj.userData.orbitRadius;
                    obj.position.z = obj.userData.basePos.z + Math.sin(t * 0.7) * obj.userData.orbitRadius;

                    const hue = (time * 0.1 + obj.userData.floatOffset) % 1;
                    obj.material.emissive.setHSL(hue, 1, 0.3);
                });
            });

            const lights = scene.children.filter(c => c instanceof THREE.PointLight);
            lights.forEach((light, i) => {
                const t = time * light.userData.speed + light.userData.offset;
                light.position.x = camera.position.x + Math.sin(t) * 50;
                light.position.y = camera.position.y + Math.cos(t * 1.2) * 50;
                light.position.z = camera.position.z + Math.sin(t * 0.8) * 50;
                light.intensity = 1 + Math.sin(time * 2 + i) * 0.5;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>

</html>
